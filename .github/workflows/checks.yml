name: Flutter and media checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Independent-reference scoring invariants
        run: python3 -m unittest discover -s scripts/alignment -p 'test_*.py' -v
      - name: Build pinned CPU inference environment
        run: docker compose --profile alignment build alignment
      - name: Explicitly install and verify model weights
        run: |
          mkdir -p .alignment-models/quran-ctc-q4-v1 output
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "$PWD/.alignment-models/quran-ctc-q4-v1:/models" \
            quran-reel-alignment:1 python -m alignment_worker.model --model-dir /models
      - name: Actual model tests without network access
        run: |
          DEV_UID="$(id -u)" DEV_GID="$(id -g)" \
          docker compose --profile alignment run --rm -e QRM_TEST_MODEL=1 \
            -v "$PWD/.alignment-models/quran-ctc-q4-v1:/opt/quran-reel/.alignment-models/quran-ctc-q4-v1:ro" \
            alignment python -m unittest discover -s alignment_worker/tests -v
      - name: Native Android core parity on desktop CPU (not phone accuracy)
        run: |
          mkdir -p output/alignment-native-docker
          docker compose --profile alignment build alignment-native-checks
          DEV_UID="$(id -u)" DEV_GID="$(id -g)" \
            docker compose --profile alignment run --rm alignment-native-checks \
            python scripts/alignment/benchmark.py --cases base,partial,wrong
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Prepare mounted output and match the host user
        run: |
          mkdir -p output
          echo "DEV_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "DEV_GID=$(id -g)" >> "$GITHUB_ENV"
      - name: Build development image
        run: docker compose build dev
      - name: Analyze and test including FFmpeg
        run: docker compose run --rm checks
      - name: Native editor workflow in a private display
        run: ./scripts/docker-integration-test.sh
      - name: Native standalone video trimmer workflow
        run: docker compose run --rm dev bash scripts/check-trimmer-ui.sh
      - name: Build Linux release
        run: docker compose run --rm build-linux
      - name: Preserve executable permissions in the artifact
        run: tar -czf output/quran-reel-linux.tar.gz -C output linux
      - uses: actions/upload-artifact@v4
        with:
          name: quran-reel-linux
          path: output/quran-reel-linux.tar.gz
