name: quran_reel_maker
description: Offline Quran recitation video editor for Linux and Android.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.13.5 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.0.3
  file_picker: 10.3.10
  path: 1.9.1
  path_provider: 2.1.5
  crypto: 3.0.7
  xml: 6.6.1
  media_kit: 1.2.6
  media_kit_video: 2.0.1
  media_kit_libs_video: 1.0.7
  # Linux uses system FFmpeg; this pinned series has no Linux native plugin.
  ffmpeg_kit_flutter_new: 4.5.3
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/quran/
    - assets/fonts/OFL.txt
    - assets/fonts/NotoSans-OFL.txt
    - assets/models/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans.ttf
    - family: AmiriQuran
      fonts:
        - asset: assets/fonts/AmiriQuran.ttf
